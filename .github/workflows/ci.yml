name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # Build-time placeholders so `next build` succeeds without project secrets.
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://example.supabase.co' }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder' }}
      # Loop 01: unit tests never call the API; keep extraction/embeddings offline in CI.
      CORPUS_EXTRACTION_MODE: fixture
      EMBEDDINGS_PROVIDER: local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:unit
  # eval job (Loop 02+): runs `npm run eval -- --suite retrieval,chat` only on PRs touching
  # src/lib/ai/** and only when the ANTHROPIC_API_KEY secret exists.
